schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Proyecto
  CUB Laser Creative: emprendimiento de corte y grabado láser. La web es un
  portafolio para mostrar trabajos (fotos y videos) y facilitar el contacto.
  Empieza simple y crecerá por etapas (CMS, formularios, tienda...).
  Idioma del sitio: español.

  ## Stack
  - Astro (salida estática, sin JS en cliente salvo que sea imprescindible)
  - Tailwind CSS
  - Content Collections de Astro: cada trabajo es un archivo Markdown con frontmatter
    validado por schema (zod). Sin base de datos.
  - Imágenes locales optimizadas con el componente <Image>/<Picture> de Astro.
  - Videos: YouTube embebido con patrón "facade" propio (componente VideoYouTube):
    miniatura y botón, y el iframe de youtube-nocookie.com solo al pulsar.
    Nunca iframes cargados de inicio.
  - Contacto: enlaces a WhatsApp (https://wa.me/<numero>?text=...), sin backend.
  - Correo hola@cublasercreative.es, solo en las páginas legales: Cloudflare Email
    Routing reenvía a Gmail; Gmail envía como hola@ por el SMTP de Brevo.
  - Node 22 (fijado en .nvmrc), npm como gestor de paquetes.
  - Desarrollo en local, sin contenedores.
  - Hosting: Cloudflare Workers con recursos estáticos, sin script propio
    (`wrangler.jsonc`, build `npm run build`, salida `dist/`, cabeceras en
    `public/_headers`). Workers Builds publica cada push a `main` y genera vistas
    previas para las demás ramas. DNS del dominio en Cloudflare.

  ## Convenciones y restricciones
  - Coste de infraestructura mínimo: solo servicios gratuitos salvo el dominio.
  - Mobile-first y accesible (textos alternativos, contraste, navegación con teclado).
  - Rendimiento: objetivo Lighthouse >= 90 en móvil.
  - Datos de negocio (nombre, teléfono WhatsApp, redes) centralizados en un único
    archivo de configuración, nunca repetidos en componentes.
  - Añadir un trabajo nuevo NO debe requerir tocar código, solo crear contenido.

